{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ace.fullname" . }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
# GENERATED from config/rbac/role.yaml by hack/sync-chart-rbac.py -- do not
# edit. CI fails if this file does not match what that script produces.
#
# Wider than it looks: the operator creates the components' Deployments, Jobs
# and the RBAC their pods need, so it must hold those permissions itself.
rules:
  - apiGroups:
    - automation.ace.io
    resources:
    - automationplatforms
    - automationplatforms/status
    - automationplatforms/finalizers
    verbs:
    - '*'
  - apiGroups:
    - ''
    resources:
    - secrets
    - configmaps
    - services
    - persistentvolumeclaims
    - serviceaccounts
    verbs:
    - '*'
  - apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - pods/exec
    verbs:
    - create
    - get
  - apiGroups:
    - apps
    resources:
    - deployments
    - statefulsets
    verbs:
    - '*'
  - apiGroups:
    - awx.ansible.com
    - galaxy.ansible.com
    - eda.ansible.com
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - networking.k8s.io
    resources:
    - ingresses
    - networkpolicies
    verbs:
    - '*'
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - batch
    resources:
    - jobs
    verbs:
    - '*'
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - roles
    - rolebindings
    verbs:
    - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ace.fullname" . }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ace.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ace.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
