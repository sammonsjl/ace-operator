---
# Everything a component needs from the gateway before it starts, in the order
# the gateway requires it.
#
# This has to run BEFORE generate_service_secret. The gateway can only issue a
# secret for a service it knows about, and with none registered it rejects the
# request with an empty choice list:
#
#     argument api-slug: invalid choice: 'controller' (choose from )
#
# which reads like a bad argument rather than a missing prerequisite.

- name: Wait for the gateway API
  ansible.builtin.uri:
    url: "{{ _gw_api }}/ping/"
    validate_certs: false
  register: _ping
  retries: 60
  delay: 5
  until: _ping.status | default(0) == 200

- name: Set the gateway proxy URL
  ansible.builtin.uri:
    url: "{{ _gw_api }}/settings/all/"
    method: PUT
    validate_certs: false
    user: "{{ admin_user | default('admin') }}"
    password: "{{ _admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      gateway_proxy_url: "{{ _external_url }}"
    status_code: [200, 202]
  changed_when: true
  no_log: true

- name: Look up the API http port
  ansible.builtin.uri:
    url: "{{ _gw_api }}/http_ports/?name=port-{{ _envoy_https_port }}"
    validate_certs: false
    user: "{{ admin_user | default('admin') }}"
    password: "{{ _admin_password }}"
    force_basic_auth: true
  register: _port_q
  no_log: true

- name: Create the API http port
  ansible.builtin.uri:
    url: "{{ _gw_api }}/http_ports/"
    method: POST
    validate_certs: false
    user: "{{ admin_user | default('admin') }}"
    password: "{{ _admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "port-{{ _envoy_https_port }}"
      number: "{{ _envoy_https_port | int }}"
      use_https: true
      is_api_port: true
    status_code: 201
  when: _port_q.json.count == 0
  register: _port_c
  no_log: true

- name: Remember the http port id
  ansible.builtin.set_fact:
    _http_port_id: >-
      {{ (_port_q.json.count > 0)
         | ternary(_port_q.json.results[0].id | default(0), _port_c.json.id | default(0)) }}

- name: Register each service
  ansible.builtin.include_tasks: one_service.yml
  loop: "{{ _gw_services }}"
  loop_control:
    loop_var: _svc
    label: "{{ _svc.name }}"

# Only now can the gateway issue these. Each component's resource-server
# settings are built from its secret, which is why deploy_components runs after
# this role and not before it.
#
# Issued once PER COMPONENT, not once overall. generate_service_secret mints a
# new value on every call, so reissuing on each reconcile rewrote the sub-CR,
# rolled the Deployment and stranded the old AWX instance — but keying "already
# done" off the Secret merely existing is just as wrong: enabling hub or eda
# later then never issues theirs, and the assert below fires with no clue why.
- name: Look for service secrets already issued
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-service-secrets"
  register: _svc_secret_obj
  no_log: true

- name: Work out which components still need one
  ansible.builtin.set_fact:
    _have_secrets: >-
      {{ (_svc_secret_obj.resources[0].data | default({})).keys() | list }}
  no_log: true

- name: Issue a service secret for each component that lacks one
  kubernetes.core.k8s_exec:
    namespace: "{{ _namespace }}"
    pod: "{{ _gw_pod }}"
    command: "aap-gateway-manage generate_service_secret {{ item.slug }}"
  loop: "{{ _components | rejectattr('name', 'in', _have_secrets) | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: _new_secrets
  no_log: true

- name: Merge them into the stored set
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-service-secrets"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      data: >-
        {{ (_svc_secret_obj.resources[0].data | default({}))
           | combine(dict(
               (_new_secrets.results | default([]) | map(attribute='item') | map(attribute='name') | list)
               | zip(_new_secrets.results | default([]) | map(attribute='stdout')
                     | map('regex_search', '[A-Za-z0-9_-]{40,}') | map('b64encode') | list))) }}
  when: (_new_secrets.results | default([]) | length) > 0
  no_log: true

- name: Read the stored secrets back
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-service-secrets"
  register: _svc_secret_final
  no_log: true

- name: Keep them for the component roles to inject
  ansible.builtin.set_fact:
    _service_secret_map: >-
      {{ dict(_svc_secret_final.resources[0].data | dict2items
              | map(attribute='key') | list
              | zip(_svc_secret_final.resources[0].data | dict2items
                    | map(attribute='value') | map('b64decode') | list)) }}
  no_log: true

- name: Fail loudly if a secret is missing
  ansible.builtin.assert:
    that: _service_secret_map[item.name] | default('', true) | length >= 40
    fail_msg: >-
      No service secret for {{ item.name }}. Delete the
      {{ _name }}-service-secrets Secret to have them all reissued.
  loop: "{{ _components }}"
  loop_control:
    label: "{{ item.name }}"
