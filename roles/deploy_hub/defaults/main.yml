---
_hub_api_port: 8000
_hub_content_port: 24816
_hub_web_port: 8080
_hub_web_svc_port: 24880
_hub_redis_port: 6379
_redis_image: docker.io/library/redis:7
# Plain nginx. galaxy-operator used quay.io/ansible/galaxy-ui here, but the
# container only ever runs nginx against mounted config -- the UI's static
# files are served out of the API image, not this one.
_hub_web_image: docker.io/library/nginx:stable
