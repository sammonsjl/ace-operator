---
ace_registry: ghcr.io/sammonsjl
ace_image_tag: latest

# Resolved image references. A spec field wins; otherwise the registry default.
_gateway_image: "{{ gateway.image | default(ace_registry ~ '/ace-gateway:' ~ ace_image_tag) }}"
_controller_image: "{{ controller.image | default(ace_registry ~ '/ace-controller:' ~ ace_image_tag) }}"
_hub_image: "{{ hub.image | default(ace_registry ~ '/ace-hub:' ~ ace_image_tag) }}"
_eda_image: "{{ eda.image | default(ace_registry ~ '/ace-eda:' ~ ace_image_tag) }}"
_ee_image: "{{ ee_image | default(ace_registry ~ '/ace-ee-minimal:' ~ ace_image_tag) }}"
# awx-operator's control-plane EE container runs `receptor` as its command, so
# that slot needs an image that actually contains it — ee-minimal does not, and
# the container dies with "exec: receptor: not found". ace-receptor carries
# receptor, receptorctl and ansible-runner, which is exactly the shape wanted.
_receptor_image: "{{ receptor_image | default(ace_registry ~ '/ace-receptor:' ~ ace_image_tag) }}"
_de_image: "{{ de_image | default(ace_registry ~ '/ace-de-supported:' ~ ace_image_tag) }}"

# Which components this reconcile is responsible for. The gateway issues a
# service secret per entry, so this list gates both deployment and the init
# chain — they must not drift apart.
# slug is what the GATEWAY calls the service, and it is not always the
# component's name: the hub is registered as "galaxy", so
# `generate_service_secret hub` is rejected with
# "invalid choice: 'hub' (choose from controller, galaxy, eda)".
_components: >-
  {{ ([{'name': 'controller', 'slug': 'controller', 'kind': 'AWX'}] if controller.enabled | default(true) else [])
   + ([{'name': 'hub',        'slug': 'galaxy',     'kind': 'Galaxy'}] if hub.enabled | default(true) else [])
   + ([{'name': 'eda',        'slug': 'eda',        'kind': 'EDA'}] if eda.enabled | default(true) else []) }}

_name: "{{ ansible_operator_meta.name }}"
_namespace: "{{ ansible_operator_meta.namespace }}"
_labels:
  app.kubernetes.io/part-of: "{{ ansible_operator_meta.name }}"
  app.kubernetes.io/managed-by: ace-operator

# Browsers reach the platform here. Every JWT audience, CSRF origin and
# redirect derives from it, so a wrong value fails at login rather than at
# deploy.
_external_url: "{{ gateway.external_url | default('https://' ~ ansible_operator_meta.name ~ '-gateway') }}"

# The vendor's port map, unchanged. In podman these are separated by being on
# one host's network; in a pod the gateway and envoy containers share a network
# namespace and reach each other on 127.0.0.1 the same way.
#
# Defined here rather than in deploy_gateway because role defaults are scoped
# to their own role, and register_services needs them too.
_gw_nginx_port: 8446
_gw_uwsgi_port: 8052
_gw_grpc_port: 50051
_envoy_https_port: 8443

# Names the front door is reached by: in-cluster Service forms, and the
# external hostname if one was given.
_gw_sans: >-
  {{ ['DNS:' ~ ansible_operator_meta.name ~ '-gateway',
      'DNS:' ~ ansible_operator_meta.name ~ '-gateway.' ~ ansible_operator_meta.namespace,
      'DNS:' ~ ansible_operator_meta.name ~ '-gateway.' ~ ansible_operator_meta.namespace ~ '.svc',
      'DNS:' ~ ansible_operator_meta.name ~ '-gateway.' ~ ansible_operator_meta.namespace ~ '.svc.cluster.local',
      'DNS:localhost', 'IP:127.0.0.1']
     + (['DNS:' ~ (gateway.external_url | default('') | regex_replace('^https?://', '') | regex_replace('/.*$', ''))]
        if gateway.external_url is defined else []) }}
