---
# Preparation only. Everything the gateway needs must exist before its
# Deployment is created, because the init chain runs inside a pod that has to
# already be up.
#
# Every secret here is CREATE-ONCE. `state: present` with a generating lookup
# would mint a new value on every reconcile — rotating the admin password and
# the Django secret key underneath a running platform, which reads as a
# mysterious login failure rather than as a bug in this file.

- name: Look for the secrets that must survive a reconcile
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ item }}"
  register: _existing
  loop:
    - "{{ admin_password_secret | default(_name ~ '-admin-password') }}"
    - "{{ _name }}-db-fields-encryption"
  no_log: true

- name: Generate the admin password, only if it does not exist yet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-admin-password"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      stringData:
        password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: _existing.results[0].resources | length == 0
  no_log: true

- name: Create the database field-encryption key, only if it does not exist yet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-db-fields-encryption"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      stringData:
        secret_key: "{{ lookup('password', '/dev/null length=50 chars=ascii_letters,digits') }}"
  when: _existing.results[1].resources | length == 0
  no_log: true

- name: Read the admin password back
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ admin_password_secret | default(_name ~ '-admin-password') }}"
  register: _admin_secret
  no_log: true

- name: Keep it for the gateway init chain
  ansible.builtin.set_fact:
    _admin_password: "{{ _admin_secret.resources[0].data.password | b64decode }}"
  no_log: true
