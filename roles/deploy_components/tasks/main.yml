---
# ACE deploys its own components. It used to render one custom resource per
# component and hand off to awx-operator, galaxy-operator and
# eda-server-operator; those three are gone, and with them the requirement to
# install three more operators before ACE could run at all.
#
# Owning the Deployments also means every image is one we build. The old path
# left quay.io/ansible/awx-ee in the task pod as the receptor sidecar, because
# that choice belonged to awx-operator rather than to us.

- name: Deploy the controller
  ansible.builtin.include_role:
    name: deploy_controller
  when: controller.enabled | default(true)

- name: Deploy the hub
  ansible.builtin.include_role:
    name: deploy_hub
  when: hub.enabled | default(true)

- name: Deploy EDA
  ansible.builtin.include_role:
    name: deploy_eda
  when: eda.enabled | default(true)

# Waiting happens after every CR exists, not between them. Inline waits meant a
# component whose operator was slow or missing blocked the ones after it from
# being created at all.
- name: Wait for each component to come up
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-{{ item }}"
  register: _comp
  retries: 120
  delay: 10
  until:
    - _comp.resources | length > 0
    - _comp.resources[0].status.readyReplicas | default(0) | int > 0
  loop: >-
    {{ (['controller-task'] if controller.enabled | default(true) else [])
     + (['hub-api'] if hub.enabled | default(true) else [])
     + (['eda-api'] if eda.enabled | default(true) else []) }}
  loop_control:
    label: "{{ item }}"
