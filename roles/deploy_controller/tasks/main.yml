---
# The controller, deployed directly rather than through awx-operator. The
# resources here are the ones awx-operator used to render from an AWX CR:
# settings, a redis sidecar on a unix socket, web and task Deployments, the
# migration Job, and the RBAC the task pod needs to launch container-group
# jobs as pods.

- name: Read the controller's database connection
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-controller-pg"
  register: _ctl_pg_secret
  no_log: true

- name: Keep the connection details for credentials.py
  ansible.builtin.set_fact:
    _ctl_pg: >-
      {{ dict(_ctl_pg_secret.resources[0].data | dict2items
              | map(attribute='key') | list
              | zip(_ctl_pg_secret.resources[0].data | dict2items
                    | map(attribute='value') | map('b64decode') | list)) }}
  no_log: true

- name: Create the websocket broadcast secret, only if it does not exist
  block:
    - name: Look for an existing one
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ _namespace }}"
        name: "{{ _name }}-controller-broadcast"
      register: _ctl_ws

    # Shared between web replicas so they can fan job output out to each
    # other; regenerating it just disconnects them until they all restart.
    - name: Generate one
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _name }}-controller-broadcast"
            namespace: "{{ _namespace }}"
            labels: "{{ _labels }}"
          stringData:
            secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when: _ctl_ws.resources | length == 0
      no_log: true

    - name: Read it back
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ _namespace }}"
        name: "{{ _name }}-controller-broadcast"
      register: _ctl_ws_final
      no_log: true

- name: Keep the websocket secret for credentials.py
  ansible.builtin.set_fact:
    _ctl_ws_secret: "{{ _ctl_ws_final.resources[0].data.secret | b64decode }}"
  no_log: true

- name: Create the controller's Django secret key, only if it does not exist
  block:
    - name: Look for an existing secret key
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ _namespace }}"
        name: "{{ _name }}-controller-secret-key"
      register: _ctl_key

    # Regenerating this invalidates every stored credential in the database,
    # because AWX encrypts them with it. Create-once is deliberate here, in a
    # way it was not for the gateway's certificate.
    - name: Generate one
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _name }}-controller-secret-key"
            namespace: "{{ _namespace }}"
            labels: "{{ _labels }}"
          stringData:
            secret_key: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
      when: _ctl_key.resources | length == 0
      no_log: true

- name: Render the controller's configuration
  kubernetes.core.k8s:
    state: present
    # Server-side apply. state: present alone is a strategic merge patch,
    # which adds and updates list entries but never removes them -- a
    # volumeMount dropped from a template stayed on the live Deployment
    # forever, and the reconcile reported success every time.
    apply: true
    definition: "{{ item }}"
  loop:
    - "{{ lookup('template', 'configmaps.yaml.j2') | from_yaml }}"
    - "{{ lookup('template', 'settings.yaml.j2') | from_yaml }}"
    - "{{ lookup('template', 'credentials.yaml.j2') | from_yaml }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Render the controller's RBAC and Service
  kubernetes.core.k8s:
    state: present
    # Server-side apply. state: present alone is a strategic merge patch,
    # which adds and updates list entries but never removes them -- a
    # volumeMount dropped from a template stayed on the live Deployment
    # forever, and the reconcile reported success every time.
    apply: true
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'rbac.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

# A Job's spec is immutable. Naming it after the controller image alone meant
# changing what the migration runs produced a patch of the existing Job and a
# failed reconcile; hashing the commands in makes a changed command a new Job.
- name: Name the migration Job after what it runs
  ansible.builtin.set_fact:
    _ctl_migration_name: >-
      {{ _name }}-controller-migration-{{ _controller_image | regex_replace('^.*:', '') }}-{{
         (_ctl_migration_commands | join('\n')) | hash('sha1') | truncate(8, true, '') }}

- name: Look for this migration Job
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ _namespace }}"
    name: "{{ _ctl_migration_name }}"
  register: _ctl_migration_existing

# Created once and never re-applied. A Job's spec is immutable, and the Job
# controller stamps its own labels into spec.template, so re-applying an
# existing one fails every reconcile with "spec.template: Invalid value".
# The name carries a hash of the commands, so changing them makes a new Job
# rather than needing this one to change.
- name: Run the database migrations
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'migration.yaml.j2') | from_yaml }}"
  when: _ctl_migration_existing.resources | length == 0

- name: Wait for the migrations to finish
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ _namespace }}"
    name: "{{ _ctl_migration_name }}"
  register: _ctl_migration
  until: (_ctl_migration.resources[0].status.succeeded | default(0)) | int > 0
  retries: 60
  delay: 10

- name: Deploy the controller
  kubernetes.core.k8s:
    state: present
    # Server-side apply. state: present alone is a strategic merge patch,
    # which adds and updates list entries but never removes them -- a
    # volumeMount dropped from a template stayed on the live Deployment
    # forever, and the reconcile reported success every time.
    apply: true
    definition: "{{ item }}"
  loop:
    - "{{ lookup('template', 'web.yaml.j2') | from_yaml }}"
    - "{{ lookup('template', 'task.yaml.j2') | from_yaml }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# AWX will not do this itself here. Its lost-instance reaper is gated on
# receptor reporting a non-empty routing table, and a single-node deployment
# with no mesh never has one -- the task log just repeats
#   Mesh stability gate: routing table empty, deferring peer-judgment
# once a minute. Instances from replaced pods therefore stay registered,
# advertising the capacity of a pod that no longer exists, and the scheduler
# will hand control work to them.
#
# The operator knows exactly which task pods exist, so it can settle this
# without guessing.
- name: Find the task pods that actually exist
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ _namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _name }}-controller-task"
    field_selectors:
      - status.phase=Running
  register: _ctl_pods

# Done inside the pod with awx-manage rather than over the controller's API:
# the platform delegates authentication to the gateway, so the component has
# no local password of its own to authenticate with.
- name: Deprovision instances whose pods are gone
  kubernetes.core.k8s_exec:
    namespace: "{{ _namespace }}"
    pod: "{{ _ctl_pods.resources[0].metadata.name }}"
    container: task
    command: >-
      bash -c 'live="{{ _ctl_pods.resources | map(attribute='"'"'metadata.name'"'"') | join(" ") }}";
      for h in $(awx-manage list_instances 2>/dev/null | grep -oE "{{ _name }}-controller-task-[a-z0-9-]+" | sort -u); do
        case " $live " in *" $h "*) ;; *) awx-manage deprovision_instance --hostname="$h" ;; esac
      done'
  when: _ctl_pods.resources | length > 0
  register: _ctl_reap
  changed_when: "'Instance Removed' in (_ctl_reap.stdout | default(''))"
  failed_when: false
