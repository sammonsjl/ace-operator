---
# The gateway is the only component this operator deploys itself; the rest are
# sub-CRs handed to their own operators. It has to be first-class here because
# nothing else can start until it has issued their service secrets.

- name: Look for an existing gateway secret key
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-gateway-secret"
  register: _gw_key_existing
  no_log: true

# Rotating this would invalidate every session and every signed value the
# platform has produced.
- name: Create the gateway secret key, only if it does not exist yet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-gateway-secret"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      stringData:
        secret_key: "{{ lookup('password', '/dev/null length=50 chars=ascii_letters,digits') }}"
  when: _gw_key_existing.resources | length == 0
  no_log: true

# The gateway's front-door listener is programmed into envoy over xDS and
# names a certificate. Envoy will not open the listener without it:
#
#   Error adding/updating listener(s) port-8443:
#   Failed to load incomplete private key
#
# so every pod looks healthy and nothing answers on 443.
- name: Look for an existing gateway certificate
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-gateway-tls"
  register: _tls_existing

# Create-once is not enough. The SANs derive from gateway.external_url, so
# changing the platform's hostname leaves a certificate that does not cover it
# and browsers reject the new name -- while everything inside the cluster keeps
# working, because those SANs never changed.
- name: Read the SANs on the existing certificate
  when: _tls_existing.resources | length > 0
  block:
    - name: Write it somewhere openssl can read
      ansible.builtin.copy:
        content: "{{ _tls_existing.resources[0].data['tls.crt'] | b64decode }}"
        dest: /tmp/existing-gateway.crt
        mode: "0600"
      no_log: true

    - name: Inspect it
      community.crypto.x509_certificate_info:
        path: /tmp/existing-gateway.crt
      register: _tls_info

- name: Work out whether the certificate still covers every name
  ansible.builtin.set_fact:
    _tls_stale: >-
      {{ _tls_existing.resources | length > 0
         and (_gw_sans | difference(_tls_info.subject_alt_name | default([]))) | length > 0 }}

- name: Generate a self-signed certificate for the front door
  when: _tls_existing.resources | length == 0 or _tls_stale | bool
  block:
    - name: Create a private key
      community.crypto.openssl_privatekey:
        path: /tmp/gateway.key
        size: 2048

    - name: Create a signing request
      community.crypto.openssl_csr:
        path: /tmp/gateway.csr
        privatekey_path: /tmp/gateway.key
        common_name: "{{ _name }}-gateway.{{ _namespace }}.svc"
        subject_alt_name: "{{ _gw_sans }}"

    - name: Self-sign it
      community.crypto.x509_certificate:
        path: /tmp/gateway.crt
        privatekey_path: /tmp/gateway.key
        csr_path: /tmp/gateway.csr
        provider: selfsigned
        selfsigned_not_after: "+3650d"

    - name: Store it
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _name }}-gateway-tls"
            namespace: "{{ _namespace }}"
            labels: "{{ _labels }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', '/tmp/gateway.crt') | b64encode }}"
            tls.key: "{{ lookup('file', '/tmp/gateway.key') | b64encode }}"
      no_log: true

    - name: Remove the temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/tmp/gateway.key, /tmp/gateway.csr, /tmp/gateway.crt]

    # Only on replacement. The secret is a mounted volume, and both envoy and
    # the gateway read the certificate once at startup, so a rewritten secret
    # under a running pod changes nothing until it restarts.
    - name: Restart the gateway so it serves the new certificate
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: "{{ _name }}-gateway"
        namespace: "{{ _namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  ace.io/tls-rotated-at: "{{ ansible_date_time.iso8601 | default(now().isoformat()) }}"
      when: _tls_stale | default(false) | bool

- name: Read back the secrets the Deployment references
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ item }}"
  register: _gw_secrets
  loop:
    - "{{ _name }}-gateway-secret"
    - "{{ _name }}-admin-password"
    - "{{ _name }}-gateway-pg"

- name: Render the gateway configuration
  kubernetes.core.k8s:
    state: present
    # Server-side apply. state: present alone is a strategic merge patch,
    # which adds and updates list entries but never removes them -- a
    # volumeMount dropped from a template stayed on the live Deployment
    # forever, and the reconcile reported success every time.
    apply: true
    definition: "{{ lookup('template', 'configmaps.yaml.j2') | from_yaml_all | list }}"

- name: Deploy the gateway
  kubernetes.core.k8s:
    state: present
    # Server-side apply. state: present alone is a strategic merge patch,
    # which adds and updates list entries but never removes them -- a
    # volumeMount dropped from a template stayed on the live Deployment
    # forever, and the reconcile reported success every time.
    apply: true
    definition: "{{ lookup('template', 'deployment.yaml.j2') | from_yaml_all | list }}"

- name: Wait for it to become ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-gateway"
  register: _gw
  retries: 90
  delay: 10
  until:
    - _gw.resources | length > 0
    - _gw.resources[0].status.readyReplicas | default(0) | int > 0
