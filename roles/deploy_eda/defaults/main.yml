---
_eda_web_port: 8000       # nginx, what the gateway's service node points at
_eda_api_port: 8002       # gunicorn behind it
_eda_daphne_port: 8001    # websockets
_eda_redis_port: 6379
_redis_image: docker.io/library/redis:7
# Plain nginx. eda-server-operator used quay.io/ansible/eda-ui, which in this
# deployment only runs nginx against a mounted config -- the console is the
# gateway's, not EDA's.
_eda_web_image: docker.io/library/nginx:stable
