---
- name: Look for existing postgres credentials
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-postgres"
  register: _pg_existing
  no_log: true

- name: Create the postgres credentials, only if they do not exist yet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-postgres"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      stringData:
        username: postgres
        password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: _pg_existing.resources | length == 0
  no_log: true

# The password lives in the Secret, and the lookup that created it is not a
# variable. Read it back, so a re-reconcile publishes the SAME password rather
# than generating a new one and locking every component out of the database.
- name: Read the postgres password back
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-postgres"
  register: _pg_secret
  no_log: true

- name: Keep it for the connection secrets below
  ansible.builtin.set_fact:
    _pg_password: "{{ _pg_secret.resources[0].data.password | b64decode }}"
  no_log: true

- name: Deploy postgres
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'statefulset.yaml.j2') | from_yaml_all | list }}"

- name: Wait for it to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: "{{ _namespace }}"
    name: "{{ _name }}-postgres"
  register: _pg
  retries: 60
  delay: 5
  until:
    - _pg.resources | length > 0
    - _pg.resources[0].status.readyReplicas | default(0) | int > 0

# The container's own entrypoint only creates POSTGRES_DB, and only on a first
# init of an empty data directory — so per-component databases have to be
# created here, not through initdb scripts that would never run again.
#
# CREATE DATABASE has no IF NOT EXISTS, and psql's \gexec is a meta-command
# that -c does not process ("syntax error at or near \\"), so this asks first
# and creates only when missing. Idempotent, and safe to repeat.
- name: Create a database per component
  kubernetes.core.k8s_exec:
    namespace: "{{ _namespace }}"
    pod: "{{ _name }}-postgres-0"
    command: >-
      sh -c "psql -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='{{ item.db }}'\"
      | grep -q 1 || createdb -U postgres '{{ item.db }}'"
  loop: "{{ _pg_databases }}"
  loop_control:
    label: "{{ item.db }}"
  register: _createdb
  retries: 10
  delay: 6
  until: _createdb is succeeded

# Each component operator expects its connection details in a secret of its own
# naming. Rendering them here is what lets the sub-CRs simply name one.
- name: Publish a connection secret per component
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _name }}-{{ item.component }}-pg"
        namespace: "{{ _namespace }}"
        labels: "{{ _labels }}"
      stringData:
        host: "{{ _name }}-postgres"
        port: "5432"
        database: "{{ item.db }}"
        username: postgres
        password: "{{ _pg_password }}"
        sslmode: prefer
        type: managed
  loop: "{{ _pg_databases }}"
  loop_control:
    label: "{{ item.component }}"
  no_log: true
