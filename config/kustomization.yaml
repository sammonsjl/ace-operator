---
# Everything needed to run the operator, in dependency order. Flux (or
# `kubectl apply -k`) can consume this directly, which keeps the manifests in
# the repo that owns them rather than copied into a cluster repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # Kustomize refuses to read outside its own root, so this cannot point at
  # the chart's copy in charts/ace/crds/. The two are kept identical by a CI
  # check rather than by sharing a file.
  - crd/automation.ace.io_automationplatforms.yaml
  - rbac/role.yaml
  - manager.yaml
