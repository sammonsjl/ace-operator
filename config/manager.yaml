---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ace-operator
  namespace: ace-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ace-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ace-operator
subjects:
  - kind: ServiceAccount
    name: ace-operator
    namespace: ace-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-operator
  namespace: ace-system
  labels:
    app.kubernetes.io/name: ace-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ace-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ace-operator
    spec:
      serviceAccountName: ace-operator
      containers:
        - name: manager
          image: ghcr.io/sammonsjl/ace-operator:20260911-6aaa434
          imagePullPolicy: Always
          args: ["--leader-elect", "--leader-election-id=ace-operator"]
          env:
            - name: ANSIBLE_GATHERING
              value: explicit
            - name: WATCH_NAMESPACE
              value: ""
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
